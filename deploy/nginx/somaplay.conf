server {
    listen 127.0.0.1:8081;
    server_name soma.korebench.co.ke;

    root /var/www/somaplay;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /models/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
